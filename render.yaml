services:
  - type: web
    name: crabster-technology
    runtime: node
    plan: free
    buildCommand: npm install && cd backend && npm install && cd .. && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TARGET_EMAIL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
