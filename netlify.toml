[build]
  command = "npm run build:frontend"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "TARGET_EMAIL,EMAIL_USER"

[functions]
  directory = "netlify/functions"

# Forward /api/enquiry to serverless function
[[redirects]]
  from = "/api/enquiry"
  to = "/.netlify/functions/enquiry"
  status = 200

# Client-side routing for Single Page App
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
